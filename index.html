<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 도구 도우미</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white shadow-2xl rounded-[2rem] overflow-hidden">
        
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold mb-4">도구를 선택해주세요.</h1>
            <div class="flex justify-center gap-2">
                <button onclick="showTab('pick')" class="px-4 py-2 bg-blue-500 hover:bg-blue-700 rounded-full text-sm transition">🎲 발표 뽑기</button>
                <button onclick="showTab('challenge')" class="px-4 py-2 bg-blue-500 hover:bg-blue-700 rounded-full text-sm transition">⏱️ 10초 맞추기</button>
                <button onclick="showTab('timer')" class="px-4 py-2 bg-blue-500 hover:bg-blue-700 rounded-full text-sm transition">⏳ 타이머</button>
            </div>
        </div>

        <div class="p-8">
            
            <div id="pick" class="tab-content active text-center">
                <h2 class="text-xl font-bold text-gray-700 mb-4">발표 뽑기</h2>
                <div class="mb-4">
                    <p class="text-sm text-gray-500 mb-2">학생 수 입력 또는 이름을 쉼표(,)로 구분해서 넣어주세요.</p>
                    <textarea id="pickInput" placeholder="ex. 25" class="w-full p-4 border-2 border-blue-100 rounded-xl focus:outline-none focus:border-blue-500 transition h-24 resize-none"></textarea>
                </div>
                <div id="pickResult" class="text-7xl font-black text-blue-600 my-10 min-h-[100px] flex items-center justify-center italic">?</div>
                <button onclick="runPick()" class="w-full py-4 bg-blue-600 text-white rounded-2xl text-xl font-bold hover:bg-blue-700 active:scale-95 transition shadow-lg">뽑기 시작!</button>
            </div>

            <div id="challenge" class="tab-content text-center">
                <h2 class="text-xl font-bold text-gray-700 mb-4">정확하게 10초 맞추기!</h2>
                <div id="swDisplay" class="text-8xl font-mono font-bold text-gray-800 my-12">0.00</div>
                <div id="swMessage" class="text-xl font-bold text-blue-500 mb-6 min-h-[28px]"></div>
                <button id="swBtn" onclick="handleSW()" class="w-full py-4 bg-green-500 text-white rounded-2xl text-xl font-bold hover:bg-green-600 active:scale-95 transition shadow-lg">시작</button>
            </div>

            <div id="timer" class="tab-content text-center">
                <h2 class="text-xl font-bold text-gray-700 mb-4">남은 시간</h2>
                <div class="flex justify-center gap-4 mb-6">
                    <input type="number" id="timerInput" value="60" class="w-24 text-center text-2xl border-b-4 border-purple-500 focus:outline-none">
                    <span class="text-2xl font-bold flex items-end">초</span>
                </div>
                <div id="timerDisplay" class="text-8xl font-mono font-bold text-purple-600 my-10">60</div>
                <div class="flex gap-2">
                    <button id="tBtn" onclick="handleTimer()" class="flex-1 py-4 bg-purple-500 text-white rounded-2xl text-xl font-bold hover:bg-purple-600 active:scale-95 transition shadow-lg">타이머 시작</button>
                    <button onclick="resetTimer()" class="px-6 py-4 bg-gray-200 text-gray-600 rounded-2xl font-bold hover:bg-gray-300 transition">리셋</button>
                </div>
            </div>

        </div>
    </div>

    <p class="mt-8 text-gray-400 text-sm">Made by @h_123</p>

    <script>
        // 탭 전환
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        // 1. 발표 뽑기 로직
        function runPick() {
            const val = document.getElementById('pickInput').value.trim();
            if (!val) return alert("인원수 또는 학생 이름을 입력해주세요.");

            let candidates = [];
            if (!isNaN(val)) {
                // 숫자일 때
                for (let i = 1; i <= parseInt(val); i++) candidates.push(i + "번");
            } else {
                // 이름일 때
                candidates = val.split(',').map(s => s.trim()).filter(s => s !== "");
            }

            let count = 0;
            const res = document.getElementById('pickResult');
            res.classList.remove('scale-110', 'text-red-500');
            
            const shuffle = setInterval(() => {
                res.innerText = candidates[Math.floor(Math.random() * candidates.length)];
                count++;
                if (count > 15) {
                    clearInterval(shuffle);
                    res.classList.add('scale-110', 'text-red-500', 'transition-all');
                }
            }, 60);
        }

        // 2. 10초 맞추기 로직
        let swTime = 0, swInterval = null, isSwRunning = false;
        function handleSW() {
            const btn = document.getElementById('swBtn');
            const display = document.getElementById('swDisplay');
            const msg = document.getElementById('swMessage');

            if (!isSwRunning) {
                let start = Date.now();
                swInterval = setInterval(() => {
                    swTime = (Date.now() - start) / 1000;
                    display.innerText = swTime.toFixed(2);
                }, 10);
                btn.innerText = "그만!";
                btn.classList.replace('bg-green-500', 'bg-red-500');
                msg.innerText = "";
                isSwRunning = true;
            } else {
                clearInterval(swInterval);
                const diff = Math.abs(10 - swTime).toFixed(2);
                const score = Math.max(0, 100 - (diff * 15)).toFixed(0);
                msg.innerText = `오차: ${diff}초 (정확도: ${score}%)`;
                btn.innerText = "다시 도전하기";
                btn.classList.replace('bg-red-500', 'bg-green-500');
                isSwRunning = false;
            }
        }

        // 3. 타이머 로직
        let tLeft = 60, tInterval = null;
        function handleTimer() {
            const btn = document.getElementById('tBtn');
            const display = document.getElementById('timerDisplay');
            
            if (!tInterval) {
                if(tLeft <= 0) tLeft = document.getElementById('timerInput').value;
                tInterval = setInterval(() => {
                    tLeft--;
                    display.innerText = tLeft;
                    if (tLeft <= 0) {
                        clearInterval(tInterval);
                        tInterval = null;
                        btn.innerText = "시작하기";
                        alert("타이머가 종료 되었습니다!");
                    }
                }, 1000);
                btn.innerText = "멈추기";
            } else {
                clearInterval(tInterval);
                tInterval = null;
                btn.innerText = "재개하기";
            }
        }
        function resetTimer() {
            clearInterval(tInterval);
            tInterval = null;
            tLeft = document.getElementById('timerInput').value;
            document.getElementById('timerDisplay').innerText = tLeft;
            document.getElementById('tBtn').innerText = "타이머 시작하기!";
        }
    </script>
</body>
</html>
